# Reverse proxy for GeoVerse Map Server.
#
# Terminates TLS, caches tiles at the edge, and keeps the operational
# endpoints off the public internet.
#
# Install: /etc/nginx/conf.d/geoverse-map-server.conf, then `nginx -t`.

# Edge tile cache. Sized for a small deployment; raise max_size for a
# basemap-scale tileset. Sitting in front of the server's own two tiers,
# this one absorbs repeat traffic before it ever reaches the process.
proxy_cache_path /var/cache/nginx/geoverse
                 levels=1:2
                 keys_zone=geoverse_tiles:32m
                 max_size=4g
                 inactive=7d
                 use_temp_path=off;

# Blunt protection against a client walking the whole tile pyramid.
limit_req_zone $binary_remote_addr zone=geoverse_req:10m rate=60r/s;

upstream geoverse_map_server {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name maps.example.com;

    ssl_certificate     /etc/letsencrypt/live/maps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maps.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Tiles are frequently large-ish binary blobs; let the origin's gzip
    # negotiation stand rather than re-compressing here.
    gzip off;

    # Vector tiles can exceed the default buffer on dense zooms.
    proxy_buffers        16 64k;
    proxy_buffer_size    64k;
    proxy_busy_buffers_size 128k;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The server builds absolute links (TileJSON, OGC `links`) from these.
    # Without them every URL it hands clients would say http://127.0.0.1:8080.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── Operational endpoints ────────────────────────────────
    # /metrics and /admin/* are for operators, not the public. Even with
    # API-key auth on, do not publish them; scrape over the private network
    # or from an allowlisted range.
    location ~ ^/(metrics|admin/) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
        proxy_pass http://geoverse_map_server;
    }

    # Probes: never cached, never rate-limited — a limiter that starves the
    # health check turns a traffic spike into a false outage.
    location ~ ^/(health|readyz)$ {
        access_log off;
        proxy_pass http://geoverse_map_server;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # ── Tiles ────────────────────────────────────────────────
    location /tiles/ {
        limit_req zone=geoverse_req burst=200 nodelay;

        proxy_pass http://geoverse_map_server;
        proxy_cache geoverse_tiles;
        proxy_cache_valid 200 7d;
        # Empty tiles are cheap and common at the edges of a dataset; cache
        # them too or every ocean tile becomes an origin request.
        proxy_cache_valid 204 404 1h;
        proxy_cache_revalidate on;          # honour the origin's ETag
        proxy_cache_lock on;                # one origin fetch per cold tile
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status always;

        # Tiles are immutable for a given dataset version.
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # ── Everything else (catalog, TileJSON, Features, WMTS) ──
    location / {
        limit_req zone=geoverse_req burst=100 nodelay;
        proxy_pass http://geoverse_map_server;
        proxy_cache geoverse_tiles;
        proxy_cache_valid 200 5m;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}

server {
    listen 80;
    server_name maps.example.com;
    return 301 https://$host$request_uri;
}
